org: afjsolution
service: math-history-server
frameworkVersion: "4"

# Table / bucket: set DYNAMODB_TABLE_NAME and S3_DATA_BUCKET at deploy to match Terraform
# (e.g. math-history-server-ddb-stage). Falls back to ${service}-ddb-${sls:stage}.
custom:
  dynamodbTableName: ${env:DYNAMODB_TABLE_NAME, '${self:service}-ddb-${sls:stage}'}
  bulkDdbTable: ${env:BULK_DDB_TABLE, '${self:service}-bulkimport-ddb-${sls:stage}'}
  bulkQueueUrl: ${env:BULK_QUEUE_URL, ''}
  bulkQueueArn: ${env:BULK_QUEUE_ARN, 'arn:aws:sqs:eu-north-1:111111111111:math-history-server-bulkimport-local'}
  s3DataBucket: ${env:S3_DATA_BUCKET, '${self:service}-data-${sls:stage}'}
  logRetentionInDays:
    prod: 90
    default: 7
  # HTTP API JWT authorizer. CI/deploy sets COGNITO_JWT_*; placeholders for sls offline.
  cognitoJwtIssuer: ${env:COGNITO_JWT_ISSUER, 'https://cognito-idp.eu-north-1.amazonaws.com/local'}
  cognitoJwtAudience: ${env:COGNITO_JWT_AUDIENCE, 'local-client-id'}
  corsOrigin: ${env:CORS_ORIGIN, 'http://localhost:5173'}
  serverless-offline:
    httpPort: 3000
    ignoreJWTSignature: true

provider:
  name: aws
  region: ${aws:region}
  runtime: nodejs24.x
  architecture: arm64
  logRetentionInDays: ${self:custom.logRetentionInDays.${sls:stage}, self:custom.logRetentionInDays.default}
  versionFunctions: false
  memorySize: 256
  timeout: 29
  httpApi:
    cors:
      allowedOrigins:
        - ${self:custom.corsOrigin}
        - http://127.0.0.1:5173
      allowedHeaders:
        - Content-Type
        - Authorization
        - X-Requested-With
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowCredentials: true
      maxAge: 3600
    cors:
      allowedOrigins:
        - ${self:custom.corsOrigin}
        - http://127.0.0.1:5173
      allowedHeaders:
        - Content-Type
        - Authorization
        - X-Requested-With
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowCredentials: true
      maxAge: 3600
    authorizers:
      cognitoJwt:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: ${self:custom.cognitoJwtIssuer}
        audience:
          - ${self:custom.cognitoJwtAudience}
  iam:
    role:
      name: sls-tpl-${opt:stage, 'stage'}-role
      statements:
        - Effect: "Allow"
          Action:
            - "s3:ListBucket"
          Resource:
            - "arn:aws:s3:::${self:custom.s3DataBucket}"
        - Effect: "Allow"
          Action:
            - "s3:GetObject"
            - "s3:GetObjectAcl"
            - "s3:PutObject"
            - "s3:PutObjectAcl"
            - "s3:DeleteObject"
          Resource:
            - "arn:aws:s3:::${self:custom.s3DataBucket}/*"
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:BatchGetItem
            - dynamodb:BatchWriteItem
            - dynamodb:TransactWriteItems
          Resource:
            - Fn::Sub:
                - 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoTable}'
                - DynamoTable: ${self:custom.dynamodbTableName}
            - Fn::Sub:
                - 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoTable}/index/*'
                - DynamoTable: ${self:custom.dynamodbTableName}
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:BatchWriteItem
          Resource:
            - Fn::Sub:
                - 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${BulkTable}'
                - BulkTable: ${self:custom.bulkDdbTable}
            - Fn::Sub:
                - 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${BulkTable}/index/*'
                - BulkTable: ${self:custom.bulkDdbTable}
        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource:
            - ${self:custom.bulkQueueArn}
        - Effect: Allow
          Action:
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
            - sqs:ChangeMessageVisibility
          Resource:
            - ${self:custom.bulkQueueArn}
        - Effect: Allow
          Action:
            - ses:SendEmail
          Resource: "*"
          Condition:
            StringEquals:
              ses:FromAddress: ${env:SES_SENDER, ''}
        - Effect: Allow
          Action:
            - cognito-idp:ListUsersInGroup
          Resource:
            Fn::Sub:
              - 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${PoolId}'
              - PoolId: ${env:COGNITO_USER_POOL_ID, ''}
  stackTags:
    Name: "math-history-server"
  environment:
    # Aligned with server/.env.example (override at deploy for prod secrets / table names).
    AWS_SDK_LOG_LEVEL: ${env:AWS_SDK_LOG_LEVEL, 'warn'}
    NODE_ENV: ${env:NODE_ENV, 'stage'}
    DYNAMODB_TABLE_NAME: ${self:custom.dynamodbTableName}
    DYNAMODB_ENDPOINT: ${env:DYNAMODB_ENDPOINT, ''}
    S3_DATA_BUCKET: ${self:custom.s3DataBucket}
    S3_ENDPOINT: ${env:S3_ENDPOINT, ''}
    CORS_ORIGIN: ${env:CORS_ORIGIN, ''}
    # Canonical public origin for sitemap links when API host is not the site host (no trailing slash)
    SITE_URL: ${env:SITE_URL, ''}
    # Assets CDN / public host for teacher images (presign response `imageUrl`; no trailing slash)
    TEACHER_IMAGE_CDN_BASE: ${env:TEACHER_IMAGE_CDN_BASE, ''}
    COGNITO_USER_POOL_ID: ${env:COGNITO_USER_POOL_ID, ''}
    SES_SENDER: ${env:SES_SENDER, ''}
    SES_REGION: ${env:SES_REGION, '${aws:region}'}
    REVIEW_NOTIFY_FALLBACK: ${env:REVIEW_NOTIFY_FALLBACK, ''}
    BULK_DDB_TABLE: ${self:custom.bulkDdbTable}
    BULK_QUEUE_URL: ${self:custom.bulkQueueUrl}
    BULK_BEDROCK_ENABLED: ${env:BULK_BEDROCK_ENABLED, 'false'}
    BULK_BEDROCK_MODEL_ID: ${env:BULK_BEDROCK_MODEL_ID, ''}

functions:
  imageDerivatives:
    handler: .build/handlers/s3-image-derivatives.handler
    description: S3 ObjectCreated → WebP + thumb (sharp); keys align with deleteImageFiles
    memorySize: 1024
    timeout: 60
    package:
      individually: true
      patterns:
        - ".build/**"
        - "node_modules/sharp/**"
    events:
      - s3:
          bucket: ${self:custom.s3DataBucket}
          event: s3:ObjectCreated:*
          rules:
            - prefix: images/
          existing: true
      - s3:
          bucket: ${self:custom.s3DataBucket}
          event: s3:ObjectCreated:*
          rules:
            - prefix: teachers/
          existing: true
      - s3:
          bucket: ${self:custom.s3DataBucket}
          event: s3:ObjectCreated:*
          rules:
            - prefix: teachers_img/images/
          existing: true
      - s3:
          bucket: ${self:custom.s3DataBucket}
          event: s3:ObjectCreated:*
          rules:
            - prefix: graduates_img/images/
          existing: true
  bulkSplit:
    handler: .build/handlers/s3-bulk-split.handler
    description: S3 ObjectCreated on bulk-imports/*.docx → split chunks + enqueue SQS
    # mammoth holds the full docx + document model in heap; at 1024MB large docs OOM
    # and GC-thrash. More memory = proportionally more vCPU, so this also cuts duration.
    memorySize: 2048
    timeout: 180
    reservedConcurrency: 2
    package:
      individually: true
      patterns:
        - ".build/**"
        - "node_modules/mammoth/**"
    events:
      - s3:
          bucket: ${self:custom.s3DataBucket}
          event: s3:ObjectCreated:*
          rules:
            - prefix: bulk-imports/
            - suffix: .docx
          existing: true
  bulkProcess:
    handler: .build/handlers/sqs-bulk-process.handler
    description: SQS chunk messages → extract, compare, stage candidates
    memorySize: 512
    timeout: 30
    reservedConcurrency: 5
    events:
      - sqs:
          arn: ${self:custom.bulkQueueArn}
          batchSize: 5
          functionResponseType: ReportBatchItemFailures
  api:
    handler: .build/index.handler
    memorySize: 512
    timeout: 29
    events:
      # Public routes (no JWT at the gateway — same as publicResource in code)
      - httpApi:
          path: /api/openapi
          method: GET
      - httpApi:
          path: /sitemap.xml
          method: GET
      - httpApi:
          path: /api/teachers
          method: GET
      - httpApi:
          path: /api/teachers/filters
          method: GET
      - httpApi:
          path: /api/teachers/by-slug/{slug}
          method: GET
      - httpApi:
          path: /api/layout
          method: GET
      - httpApi:
          path: /api/graduates/years
          method: GET
      - httpApi:
          path: /api/graduates/specialties
          method: GET
      - httpApi:
          path: /api/graduates
          method: GET
      - httpApi:
          path: /api/gratitudes
          method: GET
      - httpApi:
          path: /api/reviews
          method: POST
      - httpApi:
          path: /api/graduates/{year}
          method: GET
      - httpApi:
          path: /{proxy+}
          method: "*"
          authorizer:
            name: cognitoJwt

plugins:
  - serverless-plugin-resource-tagging
  - serverless-offline
